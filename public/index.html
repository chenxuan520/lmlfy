<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let Me LLM That For You</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Let Me LLM That For You</h1>
        <p>输入一个问题，然后把生成的链接分享给你的朋友。</p>

        <form id="main-form">
            <div class="form-group">
                <label for="question">你的问题:</label>
                <textarea id="question" name="question" rows="4" required></textarea>
            </div>

            <div class="form-group">
                <label for="engine">选择一个AI引擎:</label>
                <select id="engine" name="engine">
                    <optgroup label="✅ 跳转后自动出答案 (推荐)">
                        <option value="perplexity" selected>Perplexity AI</option>
                        <option value="grok">Grok</option>
                        <option value="bing">Bing Copilot</option>
                        <option value="metaso">秘塔AI搜索 (Metaso)</option>
                        <option value="felo">Felo</option>
                        <option value="tiangong">天工AI</option>
                        <option value="you">You.com</option>
                        <option value="phind">Phind</option>
                        <option value="brave">Brave Search</option>
                        <option value="so360">360 AI搜索</option>
                        <option value="baidu">百度 (Baidu)</option>
                    </optgroup>
                    <optgroup label="需对方再点一次发送">
                        <option value="chatgpt">ChatGPT</option>
                        <option value="gemini">Google Gemini</option>
                        <option value="claude">Claude</option>
                        <option value="deepseek">DeepSeek</option>
                    </optgroup>
                </select>
                <small class="field-hint">“✅”组跳转后会直接显示答案；ChatGPT、Gemini、Claude、DeepSeek 因官方安全限制只能预填问题，需要对方再点一次发送。</small>
            </div>

            <button type="submit">生成链接</button>
        </form>

        <div id="result-container" class="hidden">
            <p>已生成链接！复制并分享吧：</p>
            <input type="text" id="result-link" readonly>
            <button id="copy-button">复制</button>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
